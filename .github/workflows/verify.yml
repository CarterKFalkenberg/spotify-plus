name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.7"
      - name: Install locked dependencies when present
        run: if test -f package-lock.json; then npm ci; fi
      - name: Verify
        run: |
          if test -f scripts/check; then
            sh scripts/check
          else
            node --test tests/*.test.mjs
          fi
      - name: Verify backend contracts
        run: |
          deno fmt --check deno.json supabase/functions supabase/tests/database/run.mjs
          deno lint supabase/functions
          deno task check
          deno task test
      - name: Verify synthetic PostgreSQL transactions and concurrency
        run: node supabase/tests/database/run.mjs
