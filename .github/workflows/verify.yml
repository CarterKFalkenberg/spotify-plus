name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.7"
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: "2.120.0"
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and operating system dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify frontend, proxy, backend and PostgreSQL behavior
        run: sh scripts/check
      - name: Verify local Supabase migrations and authenticated cron delivery
        run: node scripts/check-supabase.mjs
